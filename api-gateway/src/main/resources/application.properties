spring.application.name=api-gateway

server.port = 8080

spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=core-service
spring.cloud.gateway.routes[0].uri=lb://CORE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/chat/**,/api/vision/**

spring.cloud.gateway.routes[1].id=note-service
spring.cloud.gateway.routes[1].uri=lb://NOTE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notes/**

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/