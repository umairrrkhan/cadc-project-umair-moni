spring.application.name=api-gateway
server.port = 8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173}

# core service
spring.cloud.gateway.server.webmvc.routes[0].id=core-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CORE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/chat/**,/api/vision/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=coreServiceBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/core
spring.cloud.gateway.server.webmvc.routes[0].filters[1].name=DedupeResponseHeader
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.name=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# note sservice
spring.cloud.gateway.server.webmvc.routes[1].id=note-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://NOTE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/notes/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=noteServiceBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/note
spring.cloud.gateway.server.webmvc.routes[1].filters[1].name=DedupeResponseHeader
spring.cloud.gateway.server.webmvc.routes[1].filters[1].args.name=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# discovery and ressilence
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=5000
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.configs.default.maxWaitDurationInHalfOpenState=30000
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=60000
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.coreServiceBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.noteServiceBreaker.baseConfig=default

management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true
management.endpoint.health.probes.enabled=true

spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
